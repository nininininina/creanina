<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Honden vs Katten</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif;}
body{background:#1a1a2e;display:flex;justify-content:center;align-items:flex-start;min-height:100vh;padding:16px;}
#wrap{width:100%;max-width:700px;}
#arena{position:relative;width:100%;height:400px;border-radius:16px;overflow:hidden;border:3px solid #444;}
#sky{position:absolute;inset:0;background:#74c8f0;}
#sun{position:absolute;top:16px;right:60px;width:56px;height:56px;background:#ffe84a;border-radius:50%;border:4px solid #ffc800;}
#hill1{position:absolute;bottom:33%;left:-30px;width:260px;height:160px;background:#4db84a;border-radius:50%;}
#hill2{position:absolute;bottom:33%;right:-30px;width:220px;height:140px;background:#3da03a;border-radius:50%;}
#hill3{position:absolute;bottom:33%;left:28%;width:200px;height:110px;background:#58c854;border-radius:50%;}
#ground{position:absolute;bottom:0;left:0;width:100%;height:36%;background:#5dc83a;}
#ground2{position:absolute;bottom:0;left:0;width:100%;height:18%;background:#72e04a;border-radius:0 0 16px 16px;}
.cld{position:absolute;background:white;border-radius:40px;}
#cl1{top:9%;left:8%;width:80px;height:26px;}
#cl1::before{content:'';position:absolute;top:-16px;left:14px;width:52px;height:40px;background:white;border-radius:50%;}
#cl2{top:15%;right:14%;width:62px;height:22px;}
#cl2::before{content:'';position:absolute;top:-13px;left:10px;width:40px;height:32px;background:white;border-radius:50%;}
#hpBar{position:absolute;top:10px;left:8px;width:43%;}
#cpBar{position:absolute;top:10px;right:8px;width:43%;text-align:right;}
.bLbl{font-size:13px;font-weight:bold;color:white;text-shadow:1px 1px 0 #111;margin-bottom:2px;}
.bOut{background:rgba(0,0,0,0.5);border-radius:10px;height:14px;border:1.5px solid rgba(255,255,255,0.4);}
.bIn{height:100%;border-radius:10px;transition:width 0.35s;}
#hpIn{background:#2ecc71;width:100%;}
#cpIn{background:#9b59b6;width:100%;}
#hpN,#cpN{font-size:11px;color:white;text-shadow:1px 1px 0 #222;}
#rnd{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:rgba(20,20,40,0.75);color:white;font-size:12px;font-weight:bold;padding:3px 14px;border-radius:20px;white-space:nowrap;}
#scr{position:absolute;top:34px;left:50%;transform:translateX(-50%);background:#ffe84a;color:#7a4a00;font-size:16px;font-weight:bold;padding:2px 16px;border-radius:14px;border:2px solid #ffc800;}
#msg{position:absolute;top:62px;left:50%;transform:translateX(-50%);background:rgba(20,20,40,0.75);color:white;font-size:13px;padding:4px 16px;border-radius:14px;white-space:nowrap;text-align:center;min-width:150px;}
#dogSvg{position:absolute;bottom:17%;left:3%;width:120px;height:120px;transition:left 0.22s;filter:drop-shadow(2px 4px 4px rgba(0,0,0,0.3));}
#catSvg{position:absolute;bottom:17%;right:3%;width:120px;height:120px;transition:right 0.22s;filter:drop-shadow(2px 4px 4px rgba(0,0,0,0.3));transform:scaleX(-1);}
#fx{position:absolute;font-size:44px;display:none;pointer-events:none;}
#ctrl{background:#222;border-radius:0 0 16px 16px;padding:12px;border:3px solid #444;border-top:none;}
#tinfo{text-align:center;font-size:13px;color:#aaa;margin-bottom:6px;}
#p1b,#p2b{display:flex;gap:5px;justify-content:center;flex-wrap:wrap;margin-bottom:4px;}
.ab{padding:6px 12px;font-size:12px;border-radius:8px;border:2px solid;background:#1a1a2e;cursor:pointer;font-weight:bold;transition:opacity 0.2s;}
.ab.dog{border-color:#27ae60;color:#2ecc71;}
.ab.cat{border-color:#8e44ad;color:#9b59b6;}
.ab:hover:not(:disabled){opacity:0.8;}
.ab:disabled{opacity:0.3;cursor:not-allowed;}
#br{display:flex;gap:8px;justify-content:center;margin-top:8px;}
.gb{padding:8px 18px;font-size:13px;border-radius:8px;border:2px solid #555;background:#333;cursor:pointer;color:white;font-weight:bold;}
.gb:hover{background:#444;}
#sel{display:none;background:#1a1a2e;padding:10px;border-top:1px solid #444;margin-top:8px;border-radius:8px;}
#sel h3{font-size:13px;font-weight:bold;color:#eee;text-align:center;margin-bottom:6px;}
#dp,#cp{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:6px;}
.pb{padding:5px 12px;font-size:12px;border-radius:8px;border:2px solid #444;background:#222;cursor:pointer;color:#ccc;}
.pb:hover{background:#333;}
.pb.da{border-color:#27ae60;color:#2ecc71;font-weight:bold;}
.pb.ca{border-color:#8e44ad;color:#9b59b6;font-weight:bold;}
</style>
</head>

</div>

const dAtks=[{name:"Vuurbal",dmg:12},{name:"Bijten",dmg:9},{name:"Sprong",dmg:11},{name:"Geblaf",dmg:7},{name:"Vlam",dmg:14}];
const cAtks=[{name:"Klauw",dmg:10},{name:"Magie",dmg:13},{name:"Sissen",dmg:7},{name:"Schaduw",dmg:11},{name:"Krabben",dmg:9}];
const MAX=60;
let dHp=MAX,cHp=MAX,dSc=0,cSc=0,rnd=1,maxR=3,turn='dog',busy=false,selD=0,selC=0;
function drawD(i){dogs[i].draw(document.getElementById('dogSvg'));}
function drawC(i){cats[i].draw(document.getElementById('catSvg'));}
function upBars(){
  const d=Math.max(0,dHp),c=Math.max(0,cHp);
  document.getElementById('hpIn').style.width=(d/MAX*100)+'%';
  document.getElementById('cpIn').style.width=(c/MAX*100)+'%';
  document.getElementById('hpIn').style.background=d>30?'#2ecc71':d>15?'#f39c12':'#e74c3c';
  document.getElementById('cpIn').style.background=c>30?'#9b59b6':c>15?'#f39c12':'#e74c3c';
  document.getElementById('hpN').textContent=d+'/'+MAX;
  document.getElementById('cpN').textContent=c+'/'+MAX;
  document.getElementById('scr').textContent=dSc+' - '+cSc;
  document.getElementById('rnd').textContent='Ronde '+Math.min(rnd,maxR)+'/'+maxR;
}
function setMsg(m){document.getElementById('msg').textContent=m;}
function setTI(m){document.getElementById('tinfo').textContent=m;}
function showFx(side){
  const e=document.getElementById('fx');
  e.style.display='block';e.style.opacity='1';
  e.style.left=side==='cat'?'52%':'14%';e.style.top='20%';
  setTimeout(()=>{e.style.display='none';},500);
}
function anim(who,cb){
  const e=document.getElementById(who==='dog'?'dogSvg':'catSvg');
  if(who==='dog')e.style.left='28%';else e.style.right='28%';
  setTimeout(()=>{if(who==='dog')e.style.left='3%';else e.style.right='3%';cb();},260);
}
function doAtk(who,atk){
  if(busy||turn!==who)return;
  busy=true;
  anim(who,()=>{
    const tgt=who==='dog'?'cat':'dog';
    showFx(tgt);
    if(who==='dog'){cHp-=atk.dmg;if(cHp<0)cHp=0;}
    else{dHp-=atk.dmg;if(dHp<0)dHp=0;}
    const nm=who==='dog'?dogs[selD].name:cats[selC].name;
    setMsg(nm+' gebruikt '+atk.name+'! (-'+atk.dmg+' HP)');
    upBars();
    setTimeout(()=>{
      if((who==='dog'&&cHp<=0)||(who==='cat'&&dHp<=0)){
        if(who==='dog')dSc++;else cSc++;
        upBars();
        if(dSc+cSc>=maxR){endGame();return;}
        rnd++;setTimeout(resetRnd,900);
      } else {
        turn=who==='dog'?'cat':'dog';busy=false;
        setTI(turn==='dog'?'Speler 1 ('+dogs[selD].name+') is aan de beurt!':'Speler 2 ('+cats[selC].name+') is aan de beurt!');
        setMsg('Kies een aanval!');setBtns();
      }
    },750);
  });
}
function setBtns(){
  dAtks.forEach(a=>{const b=document.getElementById('d-'+a.name);if(b)b.disabled=(turn!=='dog'||busy);});
  cAtks.forEach(a=>{const b=document.getElementById('c-'+a.name);if(b)b.disabled=(turn!=='cat'||busy);});
}
function buildBtns(){
  const p1=document.getElementById('p1b'),p2=document.getElementById('p2b');
  p1.innerHTML='<span style="font-size:11px;color:#aaa;align-self:center;">🐕 Speler 1:</span>';
  p2.innerHTML='<span style="font-size:11px;color:#aaa;align-self:center;">🐈 Speler 2:</span>';
  dAtks.forEach(a=>{const b=document.createElement('button');b.className='ab dog';b.id='d-'+a.name;b.textContent=a.name+' ('+a.dmg+')';b.onclick=()=>doAtk('dog',a);p1.appendChild(b);});
  cAtks.forEach(a=>{const b=document.createElement('button');b.className='ab cat';b.id='c-'+a.name;b.textContent=a.name+' ('+a.dmg+')';b.onclick=()=>doAtk('cat',a);p2.appendChild(b);});
  setBtns();
}
function resetRnd(){dHp=MAX;cHp=MAX;turn='dog';busy=false;upBars();setMsg('Nieuwe ronde!');setTI('Speler 1 ('+dogs[selD].name+') begint!');setBtns();}
function endGame(){busy=true;const w=dSc>cSc?dogs[selD].name+' wint!':cSc>dSc?cats[selC].name+' wint!':'Gelijkspel!';setMsg(w+' ('+dSc+'-'+cSc+')');setTI('Klik Nieuw spel om opnieuw te spelen!');[...document.querySelectorAll('.ab')].forEach(b=>b.disabled=true);}
function startGame(){dHp=MAX;cHp=MAX;dSc=0;cSc=0;rnd=1;turn='dog';busy=false;drawD(selD);drawC(selC);document.getElementById('dLbl').textContent=dogs[selD].name;document.getElementById('cLbl').textContent=cats[selC].name;upBars();buildBtns();setMsg('Gevecht begint!');setTI('Speler 1 ('+dogs[selD].name+') is aan de beurt!');}
function toggleSel(){const s=document.getElementById('sel');s.style.display=s.style.display==='block'?'none':'block';buildPick();}
function buildPick(){
  const dp=document.getElementById('dp'),cp=document.getElementById('cp');
  dp.innerHTML='';cp.innerHTML='';
  dogs.forEach((d,i)=>{const b=document.createElement('button');b.className='pb'+(i===selD?' da':'');b.textContent=d.name;b.onclick=()=>{selD=i;[...document.querySelectorAll('#dp .pb')].forEach((x,j)=>x.className='pb'+(j===i?' da':''));drawD(i);};dp.appendChild(b);});
  cats.forEach((c,i)=>{const b=document.createElement('button');b.className='pb'+(i===selC?' ca':'');b.textContent=c.name;b.onclick=()=>{selC=i;[...document.querySelectorAll('#cp .pb')].forEach((x,j)=>x.className='pb'+(j===i?' ca':''));drawC(i);};cp.appendChild(b);});
}
function confirmSel(){document.getElementById('sel').style.display='none';startGame();}
drawD(0);drawC(0);buildBtns();upBars();setMsg('Kies je dier of start meteen!');
</script>
